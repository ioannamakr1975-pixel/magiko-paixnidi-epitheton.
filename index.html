rder-radius:10px;background:white;align-items:center;justify-content:center;padding:2px 9px;margin:0 3px;cursor:pointer;font-size:19px;font-weight:750;color:#6540a4}#epitheta-blog .slot.filled{border-style:solid;background:#e9f7e8}#epitheta-blog .choices{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:18px 0}#epitheta-blog .chip{border:0;border-radius:12px;padding:13px 18px;font-size:19px;font-weight:750;cursor:grab;touch-action:manipulation;box-shadow:0 4px 0 #0002;color:#25334c}#epitheta-blog .chip.selected{outline:4px solid #7150b6;transform:translateY(-3px)}#epitheta-blog .chip:disabled{opacity:.4;cursor:default}#epitheta-blog .actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}#epitheta-blog button.action{border:0;background:#7253b7;color:white;font-size:19px;font-weight:800;border-radius:14px;padding:13px 22px;cursor:pointer}#epitheta-blog button.secondary{background:#e8e2f7;color:#59428a}#epitheta-blog .feedback{text-align:center;font-weight:750;min-height:30px;margin:12px;color:#3b7b52}#epitheta-blog .hint{text-align:center;font-size:14px;color:#6a7382}#epitheta-blog .finish{text-align:center;padding:25px}#epitheta-blog .finish .medal{font-size:75px}@media(max-width:520px){#epitheta-blog .game{margin:5px;padding:13px;border-radius:16px}#epitheta-blog .sentence{padding:13px;line-height:2.4}#epitheta-blog .slot{min-width:85px;font-size:17px}#epitheta-blog .chip{font-size:17px;padding:12px}#epitheta-blog .scene{min-height:0}#epitheta-blog .scene{height:auto;aspect-ratio:1200/430}}
